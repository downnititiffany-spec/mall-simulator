name: Tests

on:
  push:
    branches:
      - codex/cloud-v3-development
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: pwsh
    working-directory: .

jobs:
  default:
    name: Default Suite (JDK 17)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run default test suite
        run: pwsh -NoProfile -File scripts/run-tests.ps1 -Suite default -Online -MavenRepoLocal "$HOME/.m2/repository"

  spark:
    name: Spark Suite (JDK 8)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Run spark test suite
        run: pwsh -NoProfile -File scripts/run-tests.ps1 -Suite spark -Online -MavenRepoLocal "$HOME/.m2/repository"
