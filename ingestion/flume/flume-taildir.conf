# =====================================================================
# Flume Agent 配置模板 — 阶段 1 全主题 JSON 事件采集（§5.2.5）
# 目标：商城滚动日志 {landing}/events/{yyyyMMddHH}.jsonl → 集群 Landing
#       （HDFS /events/{eventType}/dt=.../hour=...，ODS 在此之上建外部表）
#
# 本机 LOCAL 开发：不需要启动 Flume —— mall-simulator 内置 LocalFileIngestor
# 实现了相同的 Taildir 语义（文件级断点、暂停恢复、at-least-once）。
# 两者对照见 ingestion/flume/README.md。
#
# 部署到 SINGLE_NODE / REMOTE_CLUSTER 时：
#   1. 把本文件放到 $FLUME_HOME/conf/agent-taildir.conf
#   2. 修改下方 taildir 的 positionFile / header 与 hdfs sink 的路径
#   3. 确保商城进程只写 events/ 目录，Flume 只读不删（§5.2.5：确认接收前不清理源日志）
# =====================================================================

ingestion.sources  = tail
ingestion.channels = fileChannel
ingestion.sinks    = hdfsSink

# ── Source: Taildir（断点采集，position 文件持久化） ──────────────────────
ingestion.sources.tail.type         = TAILDIR
ingestion.sources.tail.positionFile = /data/flume/position/taildir-position.json
ingestion.sources.tail.filegroups   = events
# 注意：Taildir 通配符只匹配存在的文件，滚动文件名 {yyyyMMddHH}.jsonl 由商城写入
ingestion.sources.tail.filegroups.events = /data/mall/landing/events/.*\.jsonl
ingestion.sources.tail.batchSize         = 500
ingestion.sources.tail.batchTimeoutMillis = 3000
ingestion.sources.tail.fileHeader         = true
ingestion.sources.tail.fileHeaderKey      = source_file
ingestion.sources.tail.trackPosition      = true

# ── Channel: 文件通道（停机不丢事件） ─────────────────────────────────────
ingestion.channels.fileChannel.type     = FILE
ingestion.channels.fileChannel.dataDirs = /data/flume/channel/data
ingestion.channels.fileChannel.checkpointDir = /data/flume/channel/checkpoint
ingestion.channels.fileChannel.capacity      = 1000000
ingestion.channels.fileChannel.transactionCapacity = 1000

# ── Sink: HDFS Landing（按事件目录/日期/小时落地） ───────────────────────
ingestion.sinks.hdfsSink.type                     = hdfs
ingestion.sinks.hdfsSink.hdfs.path                = /landing/events/%{eventType}/dt=%Y%m%d/hour=%H
ingestion.sinks.hdfsSink.hdfs.filePrefix          = events-
ingestion.sinks.hdfsSink.hdfs.fileType            = DataStream
ingestion.sinks.hdfsSink.hdfs.writeFormat         = Text
ingestion.sinks.hdfsSink.hdfs.rollInterval        = 600
ingestion.sinks.hdfsSink.hdfs.rollSize            = 134217728
ingestion.sinks.hdfsSink.hdfs.rollCount           = 0
ingestion.sinks.hdfsSink.hdfs.batchSize           = 500
ingestion.sinks.hdfsSink.hdfs.idleTimeout         = 60
ingestion.sinks.hdfsSink.hdfs.callTimeout         = 60000
# 若目标为本地文件系统（SINGLE_NODE 简易模式），改用 spooldir/file_roll 类 sink，
# 或保持 hdfs sink 指向本地 fs.file:// 前缀路径。

# ── 拓扑绑定 ─────────────────────────────────────────────────────────────
ingestion.sources.tail.channels     = fileChannel
ingestion.sinks.hdfsSink.channel    = fileChannel