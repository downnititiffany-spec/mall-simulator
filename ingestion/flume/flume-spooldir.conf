# =====================================================================
# Flume Agent 配置模板 — 阶段 2（S2-04B）完成文件采集：Spooling Directory Source
# 设计依据：docs/design/项目设计文档 V3.0.md §8.2（L259-L266 六条）＋ §8.4（L284 逻辑目录）
#
# 数据路径（只有一条，不得与 Taildir 混写）：
#   商城事务+Outbox → 滚动日志 → **完成文件** → 交接(手工/脚本) → 本配置的 spoolDir
#     → SpoolingDirSource → FileChannel → HDFS/file Sink → <landing>/raw/dt=%Y%m%d/hour=%H/
#     → 平台侧 LandingInputScanner(FLUME_RAW) → 批次账/manifest → Spark
#
# 与 flume-taildir.conf 的区别（§8.2 L268 明令不得混写）：
#   * flume-taildir.conf 采**运行中**的滚动日志（文件还在长，靠 position 断点续读，
#     本机由 LocalFileIngestor 的 file_checkpoint 等价实现）；
#   * 本文件采**已写完**的完成文件（文件不再变，靠"搬进 spool"这一动作宣告完成）。
#   两者是两种语义，不要在同一次采集里既 tail 又 spool 同一个文件。
#
# 状态：**未实测**。本机（LOCAL）没有 Flume/Hadoop，只有 platform 侧的等价实现与契约门禁
#       （connection-ingestion 的 LandingInputScanner + FlumeSpoolConfigTest）。
#       部署到 SINGLE_NODE / REMOTE_CLUSTER 并跑通 §5.2.9 采集验收前，不得声称本配置可用。
# =====================================================================

ingestion.sources  = spool
ingestion.channels = fileChannel
ingestion.sinks    = landingSink

# ── Source: Spooling Directory（只吃"完成文件"） ────────────────────────────
# 规则(1)：进 spool 的动作必须是 **同目录内改名**（同一文件系统内的 rename 才是原子的）。
#          跨盘/跨系统（Windows → WSL）请先复制成 *.jsonl.tmp，再在 spool 内 mv 成 *.jsonl。
#          文件名**永不复用**：命名带源编码 + 时间戳 + 序号，已消费的名字不得再次出现
#          （SpoolingDirSource 见到重复文件名会直接报错，这是有意的保护）。
ingestion.sources.spool.type = spooldir
ingestion.sources.spool.spoolDir = /data/flume/spool/mall

# 规则(4)：in-use 临时文件绝不进采集。includePattern 只放行"非 . / 非 _ 开头且 .jsonl 结尾"
#          的文件，因此 *.jsonl.tmp 与隐藏文件天然被挡在外面；平台侧 LandingInputScanner
#          再挡一次（.tmp 后缀 / 隐藏或 _ 路径段 / 零字节），两边口径一致。
ingestion.sources.spool.includePattern = ^[^._].*\.jsonl$
# 消费完改名而非删除：留档可审计（磁盘增长靠归档脚本处理）。
ingestion.sources.spool.deletePolicy = never
ingestion.sources.spool.fileSuffix = .COMPLETED
ingestion.sources.spool.consumeOrder = oldest
ingestion.sources.spool.recursiveDirectorySearch = false
# 解码失败**不静默跳过**：坏文件停在 spool 里等人处理，比"少采一段且无声"安全。
ingestion.sources.spool.decodeErrorPolicy = FAIL
# LINE 反序列化：一行 = 一个事件 JSON（event-contract v1）。
ingestion.sources.spool.deserializer = LINE
ingestion.sources.spool.deserializer.maxLineLength = 1048576
ingestion.sources.spool.inputCharset = UTF-8
ingestion.sources.spool.batchSize = 500
ingestion.sources.spool.channels = fileChannel
# trackerDir 默认 .flumespool（就在 spoolDir 下面）。这正是平台侧扫描器必须排除
# "任何以 . 或 _ 开头的路径段"的原因：若有人把 Landing 根误指向 spool，.flumespool/checkpoint
# 不能被当成数据文件读走（LandingInputScannerTest 钉住这条）。

# ── Channel: File Channel（规则(2)：仓库/检查点分目录且落在持久盘） ─────────
ingestion.channels.fileChannel.type = file
ingestion.channels.fileChannel.checkpointDir = /data/flume/channel/checkpoint
ingestion.channels.fileChannel.dataDirs = /data/flume/channel/data
# 不启用双检查点：单目录 + 定期落盘已满足"停机不丢事件"，双份会让"哪个是真"变模糊。
ingestion.channels.fileChannel.useDualCheckpoints = false
ingestion.channels.fileChannel.checkpointInterval = 30000
ingestion.channels.fileChannel.capacity = 1000000
ingestion.channels.fileChannel.transactionCapacity = 1000
ingestion.channels.fileChannel.keep-alive = 3
ingestion.channels.fileChannel.write-timeout = 3

# ── Sink: 源级 Landing 原始区（规则(3)：只按 ingest 时间分区，禁 %{eventType}） ──
# 为什么禁 %{eventType}：源级 raw 区是"平台还没解释过的原文"，按事件类型分目录等于让
# 采集侧先做一次业务解释，会把"哪个事件属于哪个目录"变成 Flume 的职责，进而与 ODS 的
# 分区口径分叉。类型拆分发生在 ODS/DWD，不在这里。
# 时间取 **agent 本地时间**（useLocalTimeStamp=true）＝ ingest 时刻，而不是事件自身时间：
# 事件时间可能迟到/乱序，用它分区会让同一批落进多个小时目录甚至回填历史分区。
# 路径请与 runtime_profile.landing_uri + 布局名 FLUME_RAW（目录 raw/）对齐。
ingestion.sinks.landingSink.type = hdfs
ingestion.sinks.landingSink.hdfs.path = file:///D:/Develop_code/GraduationProject/landing/raw/dt=%Y%m%d/hour=%H
# 集群部署请把上面一行换成集群路径，例如：
#   ingestion.sinks.landingSink.hdfs.path = hdfs://namenode:8020/landing/raw/dt=%Y%m%d/hour=%H
ingestion.sinks.landingSink.hdfs.useLocalTimeStamp = true
ingestion.sinks.landingSink.hdfs.filePrefix = events-
# 写中的文件带 .tmp 后缀，关闭时才原子改名 —— 平台侧扫描器凭这一点把"还在写"排除在外，
# 所以不要改 fileSuffix（默认 .tmp 就是规则(4)在 sink 侧的落点）。
ingestion.sinks.landingSink.hdfs.fileType = DataStream
ingestion.sinks.landingSink.hdfs.writeFormat = Text
# 滚动参数决定"一个小时内会产出几个完成文件"，不决定分区。
ingestion.sinks.landingSink.hdfs.rollInterval = 600
ingestion.sinks.landingSink.hdfs.rollSize = 134217728
ingestion.sinks.landingSink.hdfs.rollCount = 0
ingestion.sinks.landingSink.hdfs.batchSize = 500
ingestion.sinks.landingSink.hdfs.callTimeout = 60000
ingestion.sinks.landingSink.channel = fileChannel

# =====================================================================
# 规则(5)：at-least-once，不是 exactly-once。
#   SpoolingDirSource + FileChannel 保证"不丢"，但 sink 重试/agent 重启会导致**重复写入**。
#   平台侧因此必须去重（DWD 按 event_id），并记录 file_offset/hash 与本批计数；
#   任何"端到端恰好一次"的说法都是错的。
#
# 规则(6)：Windows 商城 → WSL spool 的交接（本机开发才有的一步）
#   1. 商城在 Windows 侧写完 <landing>/events/*.jsonl（滚动日志）后，由导出脚本/手工
#      把它复制成 WSL 内 spool 目录里的 *.jsonl.tmp；
#   2. 在 spool 目录内 mv 成 *.jsonl（同一文件系统内改名＝原子宣告"完成"）；
#   3. Windows 与 WSL 的路径不要互相 resolve（/mnt/d/... 与 D:\ 是两套字符串），
#      文件名按 (1) 的约定自带时间戳+序号，靠名字而不是靠修改时间判断先后。
# =====================================================================
