# =====================================================================
# 模拟数据生成器（V2.1 §3.1 第三个独立程序）
#
# 独立性（§3.4-1「独立构建产物、配置、端口、日志和启动命令」）：
#   * 端口：8092（规格原文；8082 全仓 0 命中，属误记）
#   * 配置命名空间：generator.*（不得出现 mall.* 或 platform.* 键）
#   * 元数据库：generator_meta（独立库，不与商城库/分析平台库共用）
#   * 日志：./logs/generator.log（相对本程序自己的工作目录）
#   * 产物：./generator-output（文件模式写入独立测试目录，绝不写分析平台 landing，§3.3 B）
# =====================================================================
server:
  port: 8092

spring:
  application:
    name: synthetic-data-generator
  datasource:
    # 独立库：库名是配置项，不是硬编码。createDatabaseIfNotExist 让首次启动即可自举，
    # 因此不需要改动仓库既有的三库初始化脚本（裁决项 B-05 只影响这一行的库名）。
    url: jdbc:mysql://127.0.0.1:3306/generator_meta?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&createDatabaseIfNotExist=true
    username: ${GENERATOR_DB_USER:root}
    password: ${GENERATOR_DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/generator
    baseline-on-migrate: true
    ignore-migration-patterns: "*:missing"

generator:
  output:
    # 文件模式（CANONICAL_EVENT_FILE）产物根目录；只允许本程序自己的目录
    root: ${GENERATOR_OUTPUT_ROOT:./generator-output}
  reproducibility:
    # 可复现口径（§4.2）：相同 plan_version + seed + time_window 必须可复现
    key-prefix: v1

logging:
  file:
    name: ${GENERATOR_LOG_FILE:./logs/generator.log}
  level:
    com.graduation.generator: INFO
