server:
  port: 8091

# R1 平台元数据库（整改书 §7.1；账号由 init-three-dbs.sql 创建）
platform:
  meta:
    url: ${PLATFORM_META_URL:jdbc:mysql://127.0.0.1:3306/analytics_meta?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true}
    username: ${PLATFORM_META_USER:meta_app}
    password: ${PLATFORM_META_PASSWORD:meta_app_pw_2026}
  # 指标库（analytics_metric）双源，V2.0 §17.1：
  #   publish = metric_pub 读写（Flyway db/metric + 指标发布写路径）
  #   read    = metric_read 仅 SELECT 已发布 ADS（看板/AI SQL/决策取值）
  metric:
    publish:
      url: ${PLATFORM_METRIC_PUBLISH_URL:jdbc:mysql://127.0.0.1:3306/analytics_metric?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true}
      username: ${PLATFORM_METRIC_PUBLISH_USER:metric_pub}
      password: ${PLATFORM_METRIC_PUBLISH_PASSWORD:metric_pub_pw_2026}
    read:
      url: ${PLATFORM_METRIC_READ_URL:jdbc:mysql://127.0.0.1:3306/analytics_metric?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true}
      username: ${PLATFORM_METRIC_READ_USER:metric_read}
      password: ${PLATFORM_METRIC_READ_PASSWORD:metric_read_pw_2026}
  # R2 落地存储与凭据（整改书 §8）：LOCAL 演示默认值，生产必须显式配置
  landing:
    local-root: ${PLATFORM_LANDING_LOCAL_ROOT:./landing}
  credential:
    ssh-default: ${CRED_SSH_DEFAULT:}
  # P1-03 源登记：source_registry.profile_path 是**仓库相对路径**，
  # 解析基准＝仓库根（平台启动约定要求工作目录为仓库根，故默认 "."）。
  # 显式做成配置键而不是硬编码相对路径，是为了让单元测试能指向临时目录、
  # 也让非"工作目录＝仓库根"的部署方式有一个明确说法而不是默默读错文件。
  source:
    profile-root: ${PLATFORM_SOURCE_PROFILE_ROOT:.}
  # S2-01B 映射 dry-run（设计 §7.3 规则 10）：预览用候选画像与受控脱敏样本。
  #   contract-path = canonical 契约位置（报告里 contractVersion/contractChecksum 的真相来源）
  #   sample-root   = sampleRef 的**唯一**解析根；默认 ./sample-data 是"没有配置就没有样本"的
  #                   fail-closed 默认值（缺失 ⇒ 平台侧 500，不回落仓库根、更不回落任意目录）
  # 两者都是显式配置键：单测指向临时目录，部署方式不同时也有明确说法，而不是默默读错文件。
  mapping:
    contract-path: ${PLATFORM_MAPPING_CONTRACT_PATH:contract-specs/schemas/canonical-event.v1.schema.json}
    sample-root: ${PLATFORM_MAPPING_SAMPLE_ROOT:./sample-data}
  # R6-11（V2.0 §15.3）：真实 Spark 作业阶段等待上限与轮询间隔（LOCAL 小样本秒级完成）
  spark:
    job-timeout-ms: ${PLATFORM_SPARK_JOB_TIMEOUT_MS:900000}
    poll-interval-ms: ${PLATFORM_SPARK_POLL_INTERVAL_MS:2000}
    # Hive 仓位置与嵌入式元数据库（LOCAL）：显式固定，避免随 spark-submit 的 CWD 漂移
    warehouse-dir: ${PLATFORM_SPARK_WAREHOUSE_DIR:./spark-warehouse}
    metastore-dir: ${PLATFORM_SPARK_METASTORE_DIR:./derby-metastore}

# 迁移由 MetaFlywayInitializer 显式执行（classpath:db/meta）；默认 flyway 关闭
spring:
  flyway:
    enabled: false
  # 正式 HTTP 输出统一 ISO-8601（总控 2026-09-15 裁定）
  # Spring Boot 默认即关闭该特性；这里显式声明，使「日期形状」有唯一配置文件所有者，
  # 防止将来改全局 ObjectMapper 时静默退回时间戳数组（[2026,9,21,10,20,30]）。
  # 测在 platform-app .../controller/MappingDryRunControllerTest#dateShapeIsIso8601OverHttp
  jackson:
    serialization:
      write-dates-as-timestamps: false