<!-- 素材 4：站点图标 favicon + 侧边栏 Logo（SVG，可随源码打包，无需二进制素材）
     放 web/public/favicon.svg，并在 index.html 加：
     <link rel="icon" type="image/svg+xml" href="/favicon.svg" /> -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E40AF"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#g)"/>
  <!-- 柱状图 + 趋势线：电商分析语义 -->
  <rect x="14" y="34" width="8" height="16" rx="2" fill="#FFFFFF" opacity=".75"/>
  <rect x="28" y="26" width="8" height="24" rx="2" fill="#FFFFFF" opacity=".9"/>
  <rect x="42" y="18" width="8" height="32" rx="2" fill="#FBBF24"/>
  <polyline points="12,40 24,32 36,24 52,14" fill="none" stroke="#FBBF24" stroke-width="3"
            stroke-linecap="round" stroke-linejoin="round" opacity=".95"/>
  <circle cx="52" cy="14" r="3.5" fill="#FFFFFF"/>
</svg>
