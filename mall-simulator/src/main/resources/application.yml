server:
  port: 8090

spring:
  application:
    name: mall-simulator
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/mall_simulator?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: ${MALL_DB_USER:root}
    password: ${MALL_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 平台侧迁移（V2 采集 / V3 指标流水线 / V4 AI审计+物化ADS / V5 决策 / V6 只读账号）
    # 已随平台复制代码移出本模块，但历史库 flyway_schema_history 中仍留有这些已应用记录；
    # 忽略 "*:missing"（Flyway 官方配置项）以免 validate 报 "applied migration not resolved locally"。
    # 现有迁移文件内容一律不改动，避免破坏 checksum。
    ignore-migration-patterns: "*:missing"
  jackson:
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

# 商城与事件发布配置（V2.2 §5.2.4/§5.2.5）
# 说明：原 mall.reader.*（AI 执行器专属只读账号）只服务于已移出的 Text-to-SQL/AI 执行器，
# 属分析平台职责，故随 ai/** 一并删除；flyway placeholders（V6 只读账号）同理删除。
mall:
  landing:
    # Landing 区根目录；事件按 {landing}/events/{yyyyMMddHH}.jsonl 滚动写入，后续由 Flume Taildir 采集
    path: ${MALL_LANDING_PATH:./landing}
  outbox:
    batch-size: 5000     # 每轮发布批大小（演示规模吞吐）
    poll-seconds: 3      # 定时发布间隔（秒）

logging:
  level:
    com.graduation.mall: info
