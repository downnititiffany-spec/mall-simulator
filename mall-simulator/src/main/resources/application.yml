server:
  port: 8090

spring:
  application:
    name: mall-simulator
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/mall_simulator?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: ${MALL_DB_USER:root}
    password: ${MALL_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

# 商城与事件发布配置（V2.2 §5.2.4/§5.2.5）
mall:
  landing:
    # Landing 区根目录；事件按 {landing}/events/{yyyyMMddHH}.jsonl 滚动写入，后续由 Flume Taildir 采集
    path: ${MALL_LANDING_PATH:./landing}
  outbox:
    batch-size: 5000     # 每轮发布批大小（演示规模吞吐）
    poll-seconds: 3      # 定时发布间隔（秒）

# AI 大模型（§4.1 OpenAI 兼容 API；密钥经环境变量，未配置时走规则回退不阻塞主链路）
llm:
  base-url: ${LLM_BASE_URL:}
  api-key: ${LLM_API_KEY:}
  model: ${LLM_MODEL:deepseek-chat}
  mock-enabled: ${LLM_MOCK_ENABLED:false}

logging:
  level:
    com.graduation.mall: info