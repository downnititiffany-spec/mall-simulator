spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/mall_simulator_test?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: ${MALL_DB_USER:root}
    password: ${MALL_DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholders:
      mall:
        reader:
          user: ${MALL_READER_USER:mall_reader}
          password: ${MALL_READER_PASSWORD:mall_reader_pw}

mall:
  reader:
    url: jdbc:mysql://127.0.0.1:3306/mall_simulator_test?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: mall_reader
    password: mall_reader_pw
    driver-class-name: com.mysql.cj.jdbc.Driver

  landing:
    path: ${java.io.tmpdir}/mall-landing-test
  outbox:
    batch-size: 200
    poll-seconds: 3600   # 测试时关闭自动轮询，仅手动 publishOnce

llm:
  base-url: ""
  api-key: "test-key"
  mock-enabled: true     # 测试统一使用 MockLlmProvider